<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>礦石工坊 · Procedural Gem Studio</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header class="topbar">

    <div class="brand">
      <div class="brand-title">礦石工坊</div>
      <div class="brand-sub">PROCEDURAL GEM STUDIO</div>
    </div>

    <div class="current-mineral">
      <span id="mineralIcon">💎</span>
      <span id="mineralName">紫水晶 AMETHYST</span>
    </div>

    <div class="top-actions">

      <button id="randomBtn" class="icon-button">
        <span>⤨</span>
        <small>隨機</small>
      </button>

      <button id="lightBtn" class="icon-button">
        <span>☼</span>
        <small>光源</small>
      </button>

      <button id="screenshotBtn" class="icon-button">
        <span>▣</span>
        <small>截圖</small>
      </button>

    </div>

  </header>


  <main>

    <section id="viewer">

      <canvas id="scene"></canvas>

      <div id="loading">
        <div class="loader"></div>
        正在生成礦石…
      </div>

      <div class="hint">
        <b>拖曳</b> 旋轉視角　
        <b>滾輪</b> 縮放　
        <b>雙指</b> 縮放
      </div>

    </section>


    <aside class="control-panel">

      <div class="panel-title">
        ✦ 礦石參數
      </div>


      <label>
        礦石種類

        <select id="type">

          <option value="amethyst">
            💜 紫水晶 Amethyst
          </option>

          <option value="quartz">
            ◇ 白水晶 Quartz
          </option>

          <option value="pyrite">
            🟡 黃鐵礦 Pyrite
          </option>

          <option value="obsidian">
            ◆ 黑曜石 Obsidian
          </option>

          <option value="malachite">
            🟢 孔雀石 Malachite
          </option>

          <option value="turquoise">
            🔵 綠松石 Turquoise
          </option>

          <option value="opal">
            🌈 蛋白石 Opal
          </option>

          <option value="moonstone">
            ◇ 月光石 Moonstone
          </option>

          <option value="ruby">
            🔴 紅寶石 Ruby
          </option>

          <option value="sapphire">
            🔷 藍寶石 Sapphire
          </option>

        </select>
      </label>


      <div class="slider-row">

        <div>
          <span>晶體數量</span>
          <strong id="crystalValue">7</strong>
        </div>

        <input
          id="crystals"
          type="range"
          min="3"
          max="14"
          value="7"
        >

      </div>


      <div class="slider-row">

        <div>
          <span>光澤</span>
          <strong id="glossValue">0.85</strong>
        </div>

        <input
          id="gloss"
          type="range"
          min="0"
          max="100"
          value="85"
        >

      </div>


      <div class="slider-row">

        <div>
          <span>透明度</span>
          <strong id="transValue">0.62</strong>
        </div>

        <input
          id="transparency"
          type="range"
          min="0"
          max="100"
          value="62"
        >

      </div>


      <div class="slider-row">

        <div>
          <span>稀有度</span>
          <strong id="rarityValue">0.75</strong>
        </div>

        <input
          id="rarity"
          type="range"
          min="0"
          max="100"
          value="75"
        >

      </div>


      <div class="section-label">
        晶體形態
      </div>

      <div class="shape-buttons">

        <button class="shape active" data-shape="cluster">
          簇狀
        </button>

        <button class="shape" data-shape="single">
          單晶
        </button>

        <button class="shape" data-shape="mass">
          塊狀
        </button>

      </div>


      <div class="section-label">
        背景
      </div>

      <div class="background-buttons">

        <button
          class="bg active"
          data-bg="black"
        ></button>

        <button
          class="bg"
          data-bg="purple"
        ></button>

        <button
          class="bg"
          data-bg="blue"
        ></button>

        <button
          class="bg"
          data-bg="white"
        ></button>

      </div>


      <button
        id="generateBtn"
        class="generate"
      >
        ✦ 生成新礦石
      </button>


      <button
        id="downloadBtn"
        class="download"
      >
        ↓　下載 PNG
      </button>


      <div class="mobile-help">
        手機：拖曳旋轉 · 雙指縮放
      </div>

    </aside>

  </main>


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./app.js"></script>

</body>
</html>
