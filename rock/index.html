<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <title>擬真礦石生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header class="topbar">
      <div>
        <h1>礦石工坊</h1>
        <p>Procedural Gem Studio</p>
      </div>
      <button id="randomTop" class="icon-btn" aria-label="隨機生成">✦</button>
    </header>

    <aside class="panel">
      <label>
        礦石種類
        <select id="type">
          <option value="amethyst">紫水晶</option>
          <option value="quartz">透明石英</option>
          <option value="pyrite">黃鐵礦</option>
          <option value="obsidian">黑曜石</option>
          <option value="malachite">孔雀石</option>
          <option value="turquoise">綠松石</option>
          <option value="opal">蛋白石</option>
          <option value="moonstone">月光石</option>
          <option value="ruby">紅寶石</option>
          <option value="sapphire">藍寶石</option>
          <option value="random">✨ 神秘隨機礦石</option>
        </select>
      </label>

      <label>
        晶體數量
        <input id="crystals" type="range" min="0" max="12" value="5">
      </label>

      <label>
        光澤
        <input id="gloss" type="range" min="0" max="100" value="82">
      </label>

      <label>
        透明度
        <input id="transparency" type="range" min="0" max="100" value="28">
      </label>

      <label>
        稀有度
        <input id="rarity" type="range" min="0" max="100" value="60">
      </label>

      <div class="buttons">
        <button id="generate" class="primary">生成礦石</button>
        <button id="download">下載 PNG</button>
      </div>

      <p class="hint">拖曳旋轉 · 雙指縮放 · 點擊 ✦ 隨機生成</p>
    </aside>

    <div id="badge">AMETHYST</div>
    <div id="loading">生成中…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
