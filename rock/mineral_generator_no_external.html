<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>擬真礦石生成器</title><style>
*{box-sizing:border-box}body{margin:0;background:#050810;color:#eef2ff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.app{max-width:1200px;margin:auto;padding:8px}.box{background:#101827;border:1px solid #28364d;border-radius:14px}header{padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}h1{font-size:20px;margin:0}.sub{font-size:11px;color:#9aa7ba}.actions{display:flex;gap:6px}button,select{font:inherit;color:#fff;background:#182337;border:1px solid #304058;border-radius:8px;padding:9px;cursor:pointer}.primary{background:linear-gradient(135deg,#7040e8,#c24ee8);border:0}.layout{display:grid;grid-template-columns:320px 1fr;gap:8px}.controls{padding:14px}.section{margin-bottom:16px}.section h3{font-size:14px;margin:0 0 8px}select{width:100%}.colors{display:flex;gap:8px;flex-wrap:wrap}.color{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}.color.active{border-color:#fff;box-shadow:0 0 0 2px #9b5cff}.shapes{display:grid;grid-template-columns:1fr 1fr;gap:6px}.active{border-color:#a855f7!important;background:#6335c5!important}.range{margin:11px 0}.rh{display:flex;justify-content:space-between;font-size:12px}.rh b{color:#d9b4ff}input[type=range]{width:100%;accent-color:#a855f7}.features{display:flex;flex-wrap:wrap;gap:5px}.feature{font-size:11px}.generate{width:100%;font-size:16px;padding:12px}.tip{font-size:11px;color:#9aa7ba;line-height:1.55;margin-top:9px;padding:8px;background:#172236;border-radius:8px}.stage{padding:8px}#view{width:100%;height:610px;display:block;background:#03050a;border-radius:9px;touch-action:none}.status{padding:9px;font-size:11px;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:5px}.preset{font-size:10px;padding:4px}.sw{height:44px;border-radius:5px;margin-bottom:3px}@media(max-width:850px){header{display:block}.actions{margin-top:9px}.actions button{flex:1}.layout{grid-template-columns:1fr}.stage{order:1}.controls{order:2}#view{height:56vh;min-height:400px}.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="app">
<header class="box"><div><h1>💎 擬真礦石生成器</h1><div class="sub">純 HTML＋CSS＋JavaScript＋Canvas，不使用 Three.js、WebGL 或外部 CDN</div></div><div class="actions"><button id="random">🎲 隨機</button><button id="light">☀️ 光照</button><button id="save" class="primary">⬇ 儲存</button></div></header>
<div class="layout"><aside class="box controls"><div class="section"><h3>礦石類型</h3><select id="mineral"><option value="amethyst">紫水晶</option><option value="fluorite">綠螢石</option><option value="sapphire">藍晶石</option><option value="agate">紅瑪瑙</option><option value="citrine">黃水晶</option><option value="quartz">白水晶</option><option value="obsidian">黑曜石</option><option value="moon">月光石</option></select></div>
<div class="section"><h3>顏色</h3><div class="colors"><i class="color active" data-c="#8b4de8" style="background:#8b4de8"></i><i class="color" data-c="#48b78a" style="background:#48b78a"></i><i class="color" data-c="#3d86df" style="background:#3d86df"></i><i class="color" data-c="#c74448" style="background:#c74448"></i><i class="color" data-c="#e2a72e" style="background:#e2a72e"></i><i class="color" data-c="#e9f3ff" style="background:#e9f3ff"></i><i class="color" data-c="#20243a" style="background:#20243a"></i><i class="color" data-c="#69d9ef" style="background:#69d9ef"></i></div></div>
<div class="section"><h3>形態</h3><div class="shapes"><button class="shape active" data-s="cluster">簇狀晶體</button><button class="shape" data-s="single">單晶體</button><button class="shape" data-s="raw">原礦</button><button class="shape" data-s="gem">拋光石</button></div></div>
<div class="section"><div class="range"><div class="rh">透明度<b id="opv">75%</b></div><input id="op" type="range" min="5" max="100" value="75"></div><div class="range"><div class="rh">光澤度<b id="shv">85%</b></div><input id="sh" type="range" min="5" max="100" value="85"></div><div class="range"><div class="rh">內部紋理<b id="txv">60%</b></div><input id="tx" type="range" min="0" max="100" value="60"></div><div class="range"><div class="rh">晶體大小<b id="szv">70%</b></div><input id="sz" type="range" min="20" max="100" value="70"></div><div class="range"><div class="rh">晶體數量<b id="ctv">55%</b></div><input id="ct" type="range" min="10" max="100" value="55"></div></div>
<div class="section"><h3>特殊特徵</h3><div class="features"><button class="feature active" data-f="inclusion">內含物</button><button class="feature" data-f="crack">冰裂紋</button><button class="feature" data-f="rainbow">彩虹</button><button class="feature" data-f="star">星光</button><button class="feature" data-f="vein">金屬礦脈</button></div></div><button id="generate" class="primary generate">✨ 生成礦石</button><div class="tip">手機可直接使用。拖曳旋轉、雙指縮放。本版本完全沒有外部 JS 套件，因此不會再出現 three 模組載入錯誤。</div></aside>
<main class="box stage"><canvas id="view"></canvas><div class="status"><span id="status">💎 紫水晶｜透明度 75%｜光澤度 85%</span><button id="fav">♡ 收藏</button></div><b style="font-size:13px">快速預設</b><div class="grid"><button class="preset" data-p="amethyst"><div class="sw" style="background:linear-gradient(135deg,#260650,#c487ff,#35106b)"></div>紫水晶</button><button class="preset" data-p="fluorite"><div class="sw" style="background:linear-gradient(135deg,#164e3d,#7ae0ae,#153c62)"></div>綠螢石</button><button class="preset" data-p="sapphire"><div class="sw" style="background:linear-gradient(135deg,#071c5c,#56a4ff,#091b58)"></div>藍晶石</button><button class="preset" data-p="agate"><div class="sw" style="background:linear-gradient(135deg,#55141b,#df6b5d,#4a0e16)"></div>紅瑪瑙</button><button class="preset" data-p="citrine"><div class="sw" style="background:linear-gradient(135deg,#744300,#ffe37a,#9a5d00)"></div>黃水晶</button><button class="preset" data-p="quartz"><div class="sw" style="background:linear-gradient(135deg,#677080,#fff,#a9c5e4)"></div>白水晶</button></div></main></div></div>
<script>
(()=>{const C=document.getElementById('view'),x=C.getContext('2d'),box=C.parentElement,N={amethyst:'紫水晶',fluorite:'綠螢石',sapphire:'藍晶石',agate:'紅瑪瑙',citrine:'黃水晶',quartz:'白水晶',obsidian:'黑曜石',moon:'月光石'},P={amethyst:'#8b4de8',fluorite:'#48b78a',sapphire:'#3d86df',agate:'#c74448',citrine:'#e2a72e',quartz:'#e9f3ff',obsidian:'#20243a',moon:'#69d9ef'};let s={m:'amethyst',c:'#8b4de8',shape:'cluster',op:75,sh:85,tx:60,sz:70,ct:55,fx:new Set(['inclusion']),light:0,rot:0,z:1},seed=1,cr=[];const R=(a,b)=>{seed=(seed*9301+49297)%233280;return a+seed/233280*(b-a)},rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)],rgba=(h,a)=>{let q=rgb(h);return`rgba(${q[0]},${q[1]},${q[2]},${a})`};
function size(){let r=box.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);C.width=r.width*d;C.height=Math.max(400,r.height-60)*d;C.style.height=C.height/d+'px';x.setTransform(d,0,0,d,0,0);draw()}function gen(){seed=Math.random()*1e6;cr=[];let b=Math.min(C.clientWidth,C.clientHeight);if(s.shape==='single')cr=[{x:0,y:0,r:b*.2*s.sz/70,h:b*.34,a:0}];else if(s.shape!=='cluster')cr=[{special:1,x:0,y:0,r:b*.29,h:0,a:0}];else for(let i=0,n=5+s.ct*.2;i<n;i++){let a=i/n*Math.PI*2+R(-.3,.3),d=b*R(.04,.2);cr.push({x:Math.cos(a)*d,y:Math.sin(a)*d*.42+b*.01,r:b*R(.065,.14)*(.7+s.sz/100*.4),h:b*R(.13,.23),a})}draw();sync()}
function poly(cx,cy,r,n,a){let p=[];for(let i=0;i<n;i++){let q=a+i*Math.PI*2/n,rr=r*R(.88,1.06);p.push([cx+Math.cos(q)*rr,cy+Math.sin(q)*rr])}return p}function path(p){x.beginPath();x.moveTo(...p[0]);p.slice(1).forEach(q=>x.lineTo(...q));x.closePath()}
function draw(){let W=C.clientWidth,H=C.clientHeight;if(!W)return;x.clearRect(0,0,W,H);let bg=x.createRadialGradient(W/2,H*.3,3,W/2,H/2,Math.max(W,H)*.7);bg.addColorStop(0,s.light?'#30455a':'#2b1d3f');bg.addColorStop(.5,'#0b0e17');bg.addColorStop(1,'#020307');x.fillStyle=bg;x.fillRect(0,0,W,H);let cx=W/2+s.rot,cy=H*.52;x.save();x.translate(cx,cy);x.scale(s.z,s.z);cr.slice().sort((a,b)=>a.y-b.y).forEach(c=>{if(c.special){let p=poly(c.x,c.y,c.r,8,.25),g=x.createRadialGradient(c.x-c.r*.25,c.y-c.r*.35,2,c.x,c.y,c.r);g.addColorStop(0,'#fff');g.addColorStop(.2,rgba(s.c,.95));g.addColorStop(.7,rgba(s.c,.6));g.addColorStop(1,rgba(s.c,.15));path(p);x.fillStyle=g;x.fill();x.strokeStyle='rgba(255,255,255,.4)';x.stroke();return}let q=rgb(s.c),w=c.r*.72,top=[c.x,c.y-c.h],l=[c.x-w,c.y+c.r*.55],r=[c.x+w,c.y+c.r*.55],bot=[c.x,c.y+c.r],g=x.createLinearGradient(c.x-w,c.y,c.x+w,c.y);g.addColorStop(0,`rgba(${Math.max(0,q[0]-55)},${Math.max(0,q[1]-55)},${Math.max(0,q[2]-55)},.5)`);g.addColorStop(.45,`rgba(${q[0]},${q[1]},${q[2]},.85)`);g.addColorStop(.78,`rgba(255,255,255,${s.sh/160})`);g.addColorStop(1,rgba(s.c,.5));x.beginPath();x.moveTo(...l);x.lineTo(...top);x.lineTo(...r);x.lineTo(...bot);x.closePath();x.fillStyle=g;x.fill();x.strokeStyle='rgba(255,255,255,.25)';x.stroke();x.beginPath();x.moveTo(c.x,c.y+c.r*.85);x.lineTo(...top);x.lineTo(...r);x.closePath();x.fillStyle=`rgba(255,255,255,${s.sh/500})`;x.fill()});if(s.fx.has('inclusion'))for(let i=0;i<12+s.tx*.2;i++){x.beginPath();x.arc(R(-W*.23,W*.23),R(-H*.2,H*.15),R(1,3.5),0,7);x.fillStyle='rgba(255,255,255,.25)';x.fill()}if(s.fx.has('crack'))for(let i=0;i<9;i++){let a=R(-W*.2,W*.2),b=R(-H*.18,H*.15);x.beginPath();x.moveTo(a,b);for(let j=0;j<4;j++){a+=R(-20,20);b+=R(-18,18);x.lineTo(a,b)}x.strokeStyle='rgba(255,255,255,.28)';x.stroke()}if(s.fx.has('vein'))for(let i=0;i<6;i++){x.beginPath();x.moveTo(R(-W*.2,W*.2),R(-H*.15,H*.15));x.lineTo(R(-W*.2,W*.2),R(-H*.15,H*.15));x.strokeStyle='rgba(240,205,120,.6)';x.stroke()}if(s.fx.has('rainbow')){let g=x.createLinearGradient(-W*.23,0,W*.23,0);['rgba(255,50,80,0)','rgba(255,220,70,.3)','rgba(50,255,190,.3)','rgba(80,130,255,.3)','rgba(210,70,255,0)'].forEach((v,i)=>g.addColorStop(i/4,v));x.fillStyle=g;x.beginPath();x.ellipse(0,-H*.04,W*.23,H*.1,-.3,0,7);x.fill()}x.globalCompositeOperation='screen';for(let i=0;i<3+s.sh/20;i++){let a=R(-W*.2,W*.2),b=R(-H*.22,H*.05),r=R(8,24),g=x.createRadialGradient(a,b,0,a,b,r);g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(a,b,r,0,7);x.fill()}if(s.fx.has('star'))for(let i=0;i<7;i++){let a=R(-W*.2,W*.2),b=R(-H*.18,H*.1);x.strokeStyle='rgba(255,255,255,.85)';x.beginPath();x.moveTo(a-7,b);x.lineTo(a+7,b);x.moveTo(a,b-7);x.lineTo(a,b+7);x.stroke()}x.globalCompositeOperation='source-over';x.restore()}
function sync(){document.getElementById('mineral').value=s.m;['op','sh','tx','sz','ct'].forEach(k=>document.getElementById(k).value=s[k]);[['op','opv'],['sh','shv'],['tx','txv'],['sz','szv'],['ct','ctv']].forEach(a=>document.getElementById(a[1]).textContent=s[a[0]]+'%');document.querySelectorAll('.color').forEach(e=>e.classList.toggle('active',e.dataset.c===s.c));document.querySelectorAll('.shape').forEach(e=>e.classList.toggle('active',e.dataset.s===s.shape));document.querySelectorAll('.feature').forEach(e=>e.classList.toggle('active',s.fx.has(e.dataset.f)));document.getElementById('status').firstChild.textContent=`💎 ${N[s.m]}｜透明度 ${s.op}%｜光澤度 ${s.sh}%`}
document.getElementById('mineral').onchange=e=>{s.m=e.target.value;s.c=P[s.m];gen()};document.querySelectorAll('.color').forEach(e=>e.onclick=()=>{s.c=e.dataset.c;gen()});document.querySelectorAll('.shape').forEach(e=>e.onclick=()=>{s.shape=e.dataset.s;gen()});document.querySelectorAll('.feature').forEach(e=>e.onclick=()=>{s.fx.has(e.dataset.f)?s.fx.delete(e.dataset.f):s.fx.add(e.dataset.f);gen()});[['op','opv'],['sh','shv'],['tx','txv'],['sz','szv'],['ct','ctv']].forEach(a=>document.getElementById(a[0]).oninput=e=>{s[a[0]]=+e.target.value;document.getElementById(a[1]).textContent=s[a[0]]+'%';draw()});document.getElementById('generate').onclick=gen;document.getElementById('light').onclick=()=>{s.light=(s.light+1)%2;draw()};document.getElementById('fav').onclick=e=>e.currentTarget.textContent=e.currentTarget.textContent.includes('♡')?'♥ 已收藏':'♡ 收藏';document.getElementById('save').onclick=()=>{let a=document.createElement('a');a.download='mineral-'+Date.now()+'.png';a.href=C.toDataURL();a.click()};document.getElementById('random').onclick=()=>{let m=Object.keys(N);s.m=m[Math.floor(Math.random()*m.length)];s.c=P[s.m];s.shape=['cluster','single','raw','gem'][Math.floor(Math.random()*4)];s.op=30+Math.floor(Math.random()*67);s.sh=55+Math.floor(Math.random()*45);s.tx=Math.floor(Math.random()*101);s.sz=45+Math.floor(Math.random()*56);s.ct=20+Math.floor(Math.random()*81);s.fx=new Set(['inclusion','crack','rainbow','star','vein'].filter(()=>Math.random()<.5));gen()};document.querySelectorAll('.preset').forEach(e=>e.onclick=()=>{s.m=e.dataset.p;s.c=P[s.m];s.shape='cluster';s.op=78;s.sh=92;s.tx=72;s.sz=72;s.ct=68;s.fx=new Set(['inclusion','crack']);gen()});let drag=false,last=0,dist=0,z0=1;C.addEventListener('pointerdown',e=>{drag=true;last=e.clientX;C.setPointerCapture(e.pointerId)});C.addEventListener('pointermove',e=>{if(drag){s.rot+=(e.clientX-last)*.55;last=e.clientX;draw()}});C.addEventListener('pointerup',()=>drag=false);C.addEventListener('pointercancel',()=>drag=false);C.addEventListener('touchstart',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1];dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);z0=s.z}},{passive:true});C.addEventListener('touchmove',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);s.z=Math.max(.65,Math.min(1.65,z0*d/dist));draw();e.preventDefault()}},{passive:false});addEventListener('resize',size);size();gen()})();
</script></body></html>
