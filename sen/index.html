<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>樂齡益智遊戲館</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --secondary-color: #f5a623;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --success-color: #2e7d32;
      --error-color: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 25px;
      overflow: hidden;
    }

    /* 頂部列整合：標題與返回按鈕同列，不佔用獨立一行 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eee;
    }

    .header-bar h1 {
      font-size: 1.8rem;
      color: var(--primary-color);
    }

    .btn-return {
      padding: 8px 16px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #888;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: none; /* 預設在選單頁隱藏 */
      transition: background-color 0.2s;
    }

    .btn-return:hover {
      background-color: #666;
    }

    /* 反饋訊息固定高度，防畫面跳動 */
    .feedback-message {
      height: 40px;
      line-height: 40px;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .feedback-message.visible {
      visibility: visible;
      opacity: 1;
    }

    .feedback-message.correct {
      color: var(--success-color);
    }

    .feedback-message.wrong {
      color: var(--error-color);
    }

    /* 選單頁樣式 */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .menu-card {
      background: #f0f7ff;
      border: 2px solid var(--primary-color);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary-color);
      transition: all 0.2s ease;
    }

    .menu-card:hover {
      background: var(--primary-color);
      color: #fff;
      transform: translateY(-2px);
    }

    /* 遊戲區域樣式 */
    .game-area {
      display: none;
    }

    .game-title {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 15px;
      color: #555;
    }

    .question-box {
      font-size: 2.8rem;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
      letter-spacing: 2px;
    }

    /* 四宮格選項 */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .option-btn {
      padding: 20px;
      font-size: 1.8rem;
      font-weight: bold;
      background: #fff;
      border: 3px solid var(--primary-color);
      border-radius: 15px;
      color: var(--primary-color);
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
    }

    .option-btn:active {
      transform: scale(0.98);
      background: #e6f2ff;
    }

    /* 計分與控制 */
    .score-board {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      margin-top: 20px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頂部列：遊戲標題 + 右側返回選單按鈕 -->
    <div class="header-bar">
      <h1 id="main-title">樂齡益智遊戲館</h1>
      <button id="return-btn" class="btn-return" onclick="showMenu()">選單</button>
    </div>

    <!-- 防跳動訊息提示區 (固定高度) -->
    <div id="feedback" class="feedback-message"></div>

    <!-- 選單視圖 -->
    <div id="menu-view" class="menu-grid">
      <div class="menu-card" onclick="startGame('math')">加減算術練習</div>
      <div class="menu-card" onclick="startGame('memory')">記憶雙胞胎</div>
    </div>

    <!-- 算術練習視圖 -->
    <div id="math-game" class="game-area">
      <div class="game-title">請選擇正確的計算結果：</div>
      <div id="math-question" class="question-box">0 + 0 = ?</div>
      <div class="options-grid" id="math-options">
        <!-- 4 個選項按鈕動態生成 -->
      </div>
      <div class="score-board">
        <span>得分：<strong id="math-score">0</strong></span>
        <span>連續正確：<strong id="math-streak">0</strong></span>
      </div>
    </div>

    <!-- 記憶雙胞胎視圖 -->
    <div id="memory-game" class="game-area">
      <div class="game-title">點擊找出相同的配對：</div>
      <div class="options-grid" id="memory-grid">
        <!-- 記憶卡片動態生成 -->
      </div>
      <div class="score-board">
        <span>已配對：<strong id="memory-score">0</strong> / 2</span>
      </div>
    </div>
  </div>

  <script>
    // 全域狀態
    let currentScore = 0;
    let streakCount = 0;
    let mathCorrectAnswer = 0;
    
    // 記憶遊戲狀態
    let memoryCards = ['🍎', '🍎', '🍌', '🍌'];
    let flippedCards = [];
    let matchedPairs = 0;

    // 清除反饋訊息
    function clearFeedback() {
      const feedback = document.getElementById('feedback');
      feedback.className = 'feedback-message';
      feedback.textContent = '';
    }

    // 顯示反饋訊息 (不會推擠畫面)
    function showFeedback(isCorrect, message = '') {
      const feedback = document.getElementById('feedback');
      feedback.textContent = message || (isCorrect ? '答對了！真棒！' : '不對喔，再試試！');
      feedback.className = `feedback-message visible ${isCorrect ? 'correct' : 'wrong'}`;
    }

    // 洗牌演算法 (Fisher-Yates Shuffle) - 解決正確答案固定位置問題
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // 切換至選單
    function showMenu() {
      clearFeedback();
      document.getElementById('main-title').textContent = '樂齡益智遊戲館';
      document.getElementById('return-btn').style.display = 'none';
      
      document.getElementById('menu-view').style.display = 'grid';
      document.getElementById('math-game').style.display = 'none';
      document.getElementById('memory-game').style.display = 'none';
    }

    // 開始遊戲
    function startGame(gameType) {
      clearFeedback();
      document.getElementById('menu-view').style.display = 'none';
      document.getElementById('return-btn').style.display = 'block';

      if (gameType === 'math') {
        document.getElementById('main-title').textContent = '算術練習';
        document.getElementById('math-game').style.display = 'block';
        currentScore = 0;
        streakCount = 0;
        updateMathScore();
        nextMathQuestion();
      } else if (gameType === 'memory') {
        document.getElementById('main-title').textContent = '記憶雙胞胎';
        document.getElementById('memory-game').style.display = 'block';
        initMemoryGame();
      }
    }

    /* --- 算術練習邏輯 --- */
    function nextMathQuestion() {
      // 隨機生成 1-20 加減法
      const isAdd = Math.random() > 0.5;
      const num1 = Math.floor(Math.random() * 15) + 1;
      const num2 = Math.floor(Math.random() * 10) + 1;
      
      if (isAdd) {
        mathCorrectAnswer = num1 + num2;
        document.getElementById('math-question').textContent = `${num1} + ${num2} = ?`;
      } else {
        // 確保減法結果為正數
        const max = Math.max(num1, num2);
        const min = Math.min(num1, num2);
        mathCorrectAnswer = max - min;
        document.getElementById('math-question').textContent = `${max} - ${min} = ?`;
      }

      // 產生 3 個干擾選項
      const optionsSet = new Set([mathCorrectAnswer]);
      while (optionsSet.size < 4) {
        let wrongAnswer = mathCorrectAnswer + (Math.floor(Math.random() * 7) - 3);
        if (wrongAnswer >= 0 && wrongAnswer !== mathCorrectAnswer) {
          optionsSet.add(wrongAnswer);
        }
      }

      // 將選項陣列進行洗牌，確保答案不固定在左上角
      const shuffledOptions = shuffle(Array.from(optionsSet));

      // 渲染選項按鈕
      const optionsContainer = document.getElementById('math-options');
      optionsContainer.innerHTML = '';
      shuffledOptions.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = option;
        btn.onclick = () => checkMathAnswer(option);
        optionsContainer.appendChild(btn);
      });
    }

    function checkMathAnswer(selectedOption) {
      if (selectedOption === mathCorrectAnswer) {
        currentScore += 10;
        streakCount++;
        showFeedback(true);
        updateMathScore();
        setTimeout(() => {
          clearFeedback();
          nextMathQuestion();
        }, 800);
      } else {
        streakCount = 0;
        showFeedback(false);
        updateMathScore();
      }
    }

    function updateMathScore() {
      document.getElementById('math-score').textContent = currentScore;
      document.getElementById('math-streak').textContent = streakCount;
    }

    /* --- 記憶雙胞胎邏輯 --- */
    function initMemoryGame() {
      matchedPairs = 0;
      flippedCards = [];
      document.getElementById('memory-score').textContent = matchedPairs;
      
      const shuffled = shuffle([...memoryCards]);
      const grid = document.getElementById('memory-grid');
      grid.innerHTML = '';

      shuffled.forEach((symbol, index) => {
        const card = document.createElement('button');
        card.className = 'option-btn';
        card.textContent = '❓';
        card.dataset.symbol = symbol;
        card.dataset.index = index;
        card.onclick = () => handleCardClick(card);
        grid.appendChild(card);
      });
    }

    function handleCardClick(card) {
      if (flippedCards.length >= 2 || card.textContent !== '❓') return;

      card.textContent = card.dataset.symbol;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        const [c1, c2] = flippedCards;
        if (c1.dataset.symbol === c2.dataset.symbol) {
          matchedPairs++;
          document.getElementById('memory-score').textContent = matchedPairs;
          showFeedback(true, '配對成功！');
          flippedCards = [];
          
          if (matchedPairs === 2) {
            setTimeout(() => {
              showFeedback(true, '恭喜通關！');
            }, 500);
          } else {
            setTimeout(clearFeedback, 800);
          }
        } else {
          showFeedback(false, '不同圖案喔！');
          setTimeout(() => {
            c1.textContent = '❓';
            c2.textContent = '❓';
            flippedCards = [];
            clearFeedback();
          }, 1000);
        }
      }
    }
  </script>
</body>
</html>
