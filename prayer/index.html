<!DOCTYPE html>

<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>普渡迴向誦讀</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  font-family:
    "Noto Serif TC",
    "Microsoft JhengHei",
    serif;

  color: #f8eedb;

  background:

    linear-gradient(
      rgba(20,14,9,.82),
      rgba(20,14,9,.90)
    ),

    url("https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1600&q=80");

  background-size: cover;

  background-position: center;

  background-attachment: fixed;

  padding: 20px 12px;

}


.container {

  width: 100%;

  max-width: 900px;

  margin: auto;

  padding: 28px;

  border-radius: 20px;

  background:
    rgba(35,25,17,.93);

  border:
    1px solid
    rgba(226,184,91,.45);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);

}


h1 {

  text-align: center;

  margin:
    0 0 8px;

  color:
    #f0cd76;

  font-size: 30px;

  letter-spacing: 5px;

}


.subtitle {

  text-align: center;

  color: #cdbd9e;

  margin-bottom: 25px;

}


/* 姓名 */

label {

  display: block;

  margin-bottom: 8px;

  color: #e5c36c;

  font-weight: bold;

}


input {

  width: 100%;

  padding: 14px;

  border-radius: 10px;

  border:
    1px solid #a9874e;

  background:
    rgba(255,255,255,.07);

  color: white;

  font-size: 18px;

  outline: none;

}


input:focus {

  border-color:
    #e9c66d;

}


input:disabled {

  opacity: .55;

}


/* 設定 */

.settings {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 12px;

  margin-top: 18px;

}


.setting {

  padding: 12px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.05);

}


.setting-title {

  color: #d6bf91;

  font-size: 14px;

  margin-bottom: 6px;

}


select {

  width: 100%;

  padding: 8px;

  border-radius: 7px;

  background: #403126;

  color: white;

  border: 1px solid #816b4a;

}


/* 經文 */

.section {

  margin-top: 25px;

}


.section-title {

  color: #e5c36c;

  font-size: 20px;

  font-weight: bold;

  margin-bottom: 10px;

}


.scripture {

  padding: 20px;

  min-height: 180px;

  border-radius: 12px;

  background:
    rgba(0,0,0,.25);

  border:
    1px solid
    rgba(255,255,255,.10);

  line-height: 2.15;

  font-size: 19px;

  white-space: pre-line;

}


/* 每段經文 */

.scripture-line {

  padding: 5px 8px;

  border-radius: 7px;

  transition:
    background .3s,
    color .3s;

}


/* 目前朗讀 */

.scripture-line.active {

  background:
    rgba(221,180,72,.20);

  color:
    #ffe18a;

}


/* 按鈕 */

.buttons {

  display: flex;

  gap: 12px;

  margin:
    25px 0;

}


button {

  flex: 1;

  padding: 15px;

  border: none;

  border-radius: 10px;

  font-size: 17px;

  cursor: pointer;

  font-family: inherit;

}


.start {

  background: #ae8535;

  color: white;

}


.start:hover {

  background: #c69d48;

}


.stop {

  background: #603b35;

  color: white;

}


.stop:hover {

  background: #795048;

}


/* 目前狀態 */

.status-box {

  text-align: center;

  padding: 15px;

  border-radius: 10px;

  background:
    rgba(174,133,53,.12);

  color: #efd278;

  line-height: 1.8;

}


/* 迴向文 */

.dedication {

  padding: 20px;

  border-radius: 12px;

  background:
    rgba(0,0,0,.25);

  line-height: 2.2;

  font-size: 18px;

  white-space: pre-line;

}


/* 音樂 */

.music-control {

  margin-top: 20px;

  text-align: center;

}


.music-control label {

  display: inline-block;

  margin-right: 10px;

}


.music-control input {

  width: auto;

}


/* 頁尾 */

.footer {

  margin-top: 25px;

  text-align: center;

  font-size: 13px;

  color: #988a72;

}


/* 手機 */

@media(max-width:650px) {

  .container {

    padding: 20px 14px;

  }


  h1 {

    font-size: 24px;

  }


  .settings {

    grid-template-columns: 1fr;

  }


  .buttons {

    flex-direction: column;

  }


  .scripture {

    font-size: 17px;

  }

}

</style>

</head>


<body>


<div class="container">


<h1>
  南無大慈大悲觀世音菩薩
</h1>


<div class="subtitle">
  普渡誦經・功德迴向
</div>


<!-- 姓名 -->

<label>
  往生者姓名
</label>


<input
  id="names"
  type="text"
  placeholder="多人請用逗號分隔，例如：王○○，李○○，陳○○"
>


<!-- 設定 -->

<div class="settings">


  <div class="setting">

    <div class="setting-title">
      誦讀遍數
    </div>

    <select id="repeatCount">

      <option value="1">
        1 遍
      </option>

      <option value="3">
        3 遍
      </option>

      <option value="7">
        7 遍
      </option>

      <option value="21">
        21 遍
      </option>

      <option value="49">
        49 遍
      </option>

      <option value="108">
        108 遍
      </option>

    </select>

  </div>


  <div class="setting">

    <div class="setting-title">
      誦讀模式
    </div>

    <select id="readingMode">

      <option value="once">
        誦讀指定遍數
      </option>

      <option value="loop">
        持續循環
      </option>

    </select>

  </div>


  <div class="setting">

    <div class="setting-title">
      語速
    </div>

    <select id="speechRate">

      <option value="0.55">
        慢
      </option>

      <option value="0.65" selected>
        慢速
      </option>

      <option value="0.75">
        標準
      </option>

      <option value="0.85">
        稍快
      </option>

    </select>

  </div>

</div>


<!-- 經文 -->

<div class="section">

  <div class="section-title">
    《般若波羅蜜多心經》
  </div>


  <div
    id="scripture"
    class="scripture">

    正在取得經文……

  </div>

</div>


<!-- 按鈕 -->

<div class="buttons">

  <button
    class="start"
    onclick="startReading()">

    ▶ 開始誦讀

  </button>


  <button
    class="stop"
    onclick="stopReading()">

    ■ 結束誦讀

  </button>

</div>


<!-- 狀態 -->

<div
  id="statusBox"
  class="status-box">

  尚未開始誦讀

</div>


<!-- 音樂 -->

<div class="music-control">

  <label>
    背景佛樂
  </label>

  <button
    onclick="toggleMusic()"
    style="flex:none;padding:8px 18px">

    ♪ 開／關音樂

  </button>

</div>


<audio
  id="bgMusic"
  loop
  preload="auto">

  <source
    src="YOUR_MUSIC_URL.mp3"
    type="audio/mpeg">

</audio>


<!-- 迴向 -->

<div class="section">

  <div class="section-title">
    迴向文
  </div>


  <div
    id="dedication"
    class="dedication">

南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩。

願以此誦唸《般若波羅蜜多心經》之功德，
專為往生者 [] 迴向。

祈願仗此佛力加被，
業障消除，
福慧增長，
離苦得樂，
蒙佛接引，
往生西方極樂世界。

  </div>

</div>


<div class="footer">

  願以誦經功德，普皆迴向。

</div>


</div>


<script>


/* ==================================
   全域變數
================================== */

let scriptureLines = [];

let isReading = false;

let currentLine = 0;

let currentRound = 1;

let totalRounds = 1;

let voices = [];

let selectedVoice = null;


/* ==================================
   語音
================================== */

function loadVoices() {

  voices =
    speechSynthesis.getVoices();


  if (!voices.length) return;


  /*
   優先：
   台灣中文
   女性語音
  */

  const femaleWords = [

    "female",
    "woman",
    "女",
    "美",
    "雅",
    "婷",
    "Mei",
    "Ting"

  ];


  selectedVoice =

    voices.find(function(v) {

      return (

        /zh-TW/i.test(v.lang)

        &&

        femaleWords.some(
          function(word) {

            return v.name
              .toLowerCase()
              .includes(
                word.toLowerCase()
              );

          }
        )

      );

    });


  if (!selectedVoice) {

    selectedVoice =

      voices.find(function(v) {

        return /zh-TW/i
          .test(v.lang);

      });

  }


  if (!selectedVoice) {

    selectedVoice =

      voices.find(function(v) {

        return /zh/i
          .test(v.lang);

      });

  }

}


speechSynthesis.onvoiceschanged =
  loadVoices;


loadVoices();


/* ==================================
   取得 Google Sheet
================================== */

function loadContent() {

  google.script.run

    .withSuccessHandler(function(data) {

      scriptureLines =
        data || [];


      renderScripture();

    })

    .withFailureHandler(function(error) {

      document
        .getElementById("scripture")
        .innerText =
        "取得經文失敗：" +
        error.message;

    })

    .getContent();

}


/* ==================================
   顯示經文
================================== */

function renderScripture() {

  const box =
    document
      .getElementById("scripture");


  box.innerHTML = "";


  scriptureLines.forEach(
    function(text, index) {

      const div =
        document.createElement("div");


      div.className =
        "scripture-line";


      div.id =
        "line-" + index;


      div.textContent =
        text;


      box.appendChild(div);

    }
  );

}


/* ==================================
   姓名
================================== */

function getNames() {

  return document
    .getElementById("names")
    .value
    .trim();

}


/* ==================================
   迴向文
================================== */

function buildDedication() {

  const names =
    getNames();


  return (

`南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩。

願以此誦唸《般若波羅蜜多心經》之功德，
專為往生者 ${names} 迴向。

祈願仗此佛力加被，
業障消除，
福慧增長，
離苦得樂，
蒙佛接引，
往生西方極樂世界。`

  );

}


/* ==================================
   更新迴向文
================================== */

function updateDedication() {

  const names =
    getNames();


  document
    .getElementById("dedication")
    .textContent =

`南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩。

願以此誦唸《般若波羅蜜多心經》之功德，
專為往生者 ${names || "[]"} 迴向。

祈願仗此佛力加被，
業障消除，
福慧增長，
離苦得樂，
蒙佛接引，
往生西方極樂世界。`;

}


/* ==================================
   開始
================================== */

function startReading() {

  stopReading();


  const names =
    getNames();


  if (!names) {

    alert(
      "請先輸入往生者姓名。"
    );

    return;

  }


  /*
   每次開始重新取得 Google Sheet
  */

  document
    .getElementById("statusBox")
    .innerText =
      "正在取得最新經文……";


  updateDedication();


  /*
   鎖定姓名
  */

  document
    .getElementById("names")
    .disabled = true;


  /*
   設定遍數
  */

  totalRounds =
    Number(
      document
        .getElementById("repeatCount")
        .value
    );


  const mode =
    document
      .getElementById("readingMode")
      .value;


  if (mode === "loop") {

    totalRounds =
      Infinity;

  }


  /*
   重新取得
  */

  google.script.run

    .withSuccessHandler(
      function(data) {

        scriptureLines =
          data || [];


        if (!scriptureLines.length) {

          stopReading();

          alert(
            "content 工作表沒有經文內容。"
          );

          return;

        }


        renderScripture();


        currentLine = 0;

        currentRound = 1;

        isReading = true;


        /*
         背景音樂
        */

        const music =
          document
            .getElementById(
              "bgMusic"
            );


        music.volume = 0.18;


        music.play()
          .catch(function(){});


        /*
         記錄訪客
        */

        logVisitor(
          names
        );


        readNext();

      }
    )

    .withFailureHandler(
      function(error) {

        stopReading();

        alert(
          "取得 Google Sheet 失敗：" +
          error.message
        );

      }
    )

    .getContent();

}


/* ==================================
   朗讀下一段
================================== */

function readNext() {

  if (!isReading) return;


  /*
   經文還沒完成
  */

  if (
    currentLine <
    scriptureLines.length
  ) {


    highlightLine(
      currentLine
    );


    const text =
      scriptureLines[
        currentLine
      ];


    updateStatus(
      "正在誦讀第 " +
      currentRound +
      " 遍"
    );


    speak(
      text,
      function() {

        currentLine++;

        readNext();

      }
    );


    return;

  }


  /*
   經文完成
   朗讀迴向
  */

  clearHighlight();


  updateStatus(
    "第 " +
    currentRound +
    " 遍：正在誦讀迴向文"
  );


  speak(
    buildDedication(),
    function() {

      if (!isReading)
        return;


      /*
       本輪完成
      */

      if (
        currentRound >=
        totalRounds
      ) {

        finishReading();

        return;

      }


      /*
       下一輪
      */

      currentRound++;

      currentLine = 0;

      readNext();

    }
  );

}


/* ==================================
   語音
================================== */

function speak(
  text,
  callback
) {

  if (!isReading)
    return;


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "zh-TW";


  utterance.rate =
    Number(
      document
        .getElementById(
          "speechRate"
        )
        .value
    );


  /*
   柔和女聲
  */

  utterance.pitch =
    1.05;


  utterance.volume =
    1;


  if (selectedVoice) {

    utterance.voice =
      selectedVoice;

  }


  utterance.onend =
    function() {

      if (isReading) {

        setTimeout(
          callback,
          400
        );

      }

    };


  utterance.onerror =
    function() {

      if (isReading) {

        setTimeout(
          callback,
          500
        );

      }

    };


  speechSynthesis.speak(
    utterance
  );

}


/* ==================================
   高亮目前經文
================================== */

function highlightLine(index) {

  clearHighlight();


  const line =
    document
      .getElementById(
        "line-" + index
      );


  if (line) {

    line.classList.add(
      "active"
    );


    line.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }

}


function clearHighlight() {

  document
    .querySelectorAll(
      ".scripture-line"
    )
    .forEach(function(el) {

      el.classList.remove(
        "active"
      );

    });

}


/* ==================================
   狀態
================================== */

function updateStatus(text) {

  document
    .getElementById(
      "statusBox"
    )
    .innerText =

      text;

}


/* ==================================
   完成
================================== */

function finishReading() {

  isReading = false;


  speechSynthesis.cancel();


  document
    .getElementById(
      "bgMusic"
    )
    .pause();


  document
    .getElementById(
      "names"
    )
    .disabled = false;


  clearHighlight();


  updateStatus(
    "誦讀圓滿，功德迴向完成。"
  );

}


/* ==================================
   結束
================================== */

function stopReading() {

  isReading = false;


  speechSynthesis.cancel();


  const music =
    document
      .getElementById(
        "bgMusic"
      );


  music.pause();


  document
    .getElementById(
      "names"
    )
    .disabled = false;


  clearHighlight();


  updateStatus(
    "誦讀已結束"
  );

}


/* ==================================
   音樂
================================== */

function toggleMusic() {

  const music =
    document
      .getElementById(
        "bgMusic"
      );


  if (
    music.paused
  ) {

    music.volume = 0.18;

    music.play()
      .catch(function(){});

  } else {

    music.pause();

  }

}


/* ==================================
   IP + 使用紀錄
================================== */

async function logVisitor(names) {

  let ip =
    "未知";


  /*
   使用公開 IP 查詢服務

   注意：
   這個 IP 是瀏覽器
   查到的公開網路 IP。
  */

  try {

    const response =
      await fetch(
        "https://api.ipify.org?format=json"
      );


    const data =
      await response.json();


    if (data.ip) {

      ip = data.ip;

    }

  } catch (error) {

    ip = "無法取得";

  }


  /*
   送給 GAS doPost

   由於 GAS Web App
   本身不能直接讀訪客 IP，
   因此由前端傳入。
  */

  try {

    const payload = {

      ip: ip,

      pageName:
        "普渡迴向誦讀",

      names:
        names,

      userAgent:
        navigator.userAgent

    };


    /*
     注意：

     這裡不能使用
     google.script.run
     呼叫 doPost。

     doPost 是 HTTP POST 入口。

     因此使用目前 GAS 網頁網址。
    */


    fetch(
      window.location.href,
      {

        method: "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    )
    .catch(function(){});


  } catch (error) {

    console.log(
      "訪客紀錄失敗",
      error
    );

  }

}


/* ==================================
   姓名輸入
================================== */

document
  .getElementById("names")
  .addEventListener(
    "input",
    updateDedication
  );


/* ==================================
   初始
================================== */

loadContent();

updateDedication();


</script>


</body>

</html>
