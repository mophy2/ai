<!DOCTYPE html>

<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>普渡迴向誦讀</title>


<style>

/* =========================================
   基本
========================================= */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  font-family:
    "Noto Serif TC",
    "Microsoft JhengHei",
    serif;

  color: #f7edd8;


  /*
   佛教氛圍背景
  */

  background:

    linear-gradient(
      rgba(20, 14, 9, .82),
      rgba(20, 14, 9, .92)
    ),

    url("https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1600&q=80");

  background-size: cover;

  background-position: center;

  background-attachment: fixed;

  padding: 20px 12px;

}


/* =========================================
   主容器
========================================= */

.container {

  width: 100%;

  max-width: 900px;

  margin: auto;

  padding: 28px;

  border-radius: 20px;

  background:
    rgba(35, 25, 17, .94);

  border:
    1px solid
    rgba(226, 184, 91, .45);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);

}


/* =========================================
   標題
========================================= */

h1 {

  text-align: center;

  margin:
    0 0 8px;

  color:
    #f0cd76;

  font-size: 30px;

  letter-spacing: 5px;

}


.subtitle {

  text-align: center;

  color:
    #cdbd9e;

  margin-bottom:
    25px;

}


/* =========================================
   姓名
========================================= */

label {

  display: block;

  margin-bottom: 8px;

  color:
    #e5c36c;

  font-weight: bold;

}


#names {

  width: 100%;

  padding: 14px;

  border-radius: 10px;

  border:
    1px solid #a9874e;

  background:
    rgba(255,255,255,.07);

  color: white;

  font-size: 18px;

  outline: none;

}


#names:focus {

  border-color:
    #e9c66d;

  box-shadow:
    0 0 10px
    rgba(233,198,109,.15);

}


#names:disabled {

  opacity:
    .5;

}


/* =========================================
   設定
========================================= */

.settings {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 12px;

  margin-top: 18px;

}


.setting {

  padding: 12px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.05);

}


.setting-title {

  color:
    #d6bf91;

  font-size: 14px;

  margin-bottom: 6px;

}


select {

  width: 100%;

  padding: 9px;

  border-radius: 7px;

  background:
    #403126;

  color:
    white;

  border:
    1px solid #816b4a;

}


/* =========================================
   區塊
========================================= */

.section {

  margin-top:
    25px;

}


.section-title {

  color:
    #e5c36c;

  font-size:
    20px;

  font-weight:
    bold;

  margin-bottom:
    10px;

}


/* =========================================
   經文
========================================= */

.scripture {

  padding:
    20px;

  min-height:
    180px;

  border-radius:
    12px;

  background:
    rgba(0,0,0,.25);

  border:
    1px solid
    rgba(255,255,255,.10);

  line-height:
    2.15;

  font-size:
    19px;

}


/*
   每一段
*/

.scripture-line {

  padding:
    5px 8px;

  border-radius:
    7px;

  transition:
    .3s;

}


/*
   正在朗讀
*/

.scripture-line.active {

  background:
    rgba(221,180,72,.20);

  color:
    #ffe18a;

  box-shadow:
    0 0 12px
    rgba(221,180,72,.08);

}


/* =========================================
   按鈕
========================================= */

.buttons {

  display:
    flex;

  gap:
    12px;

  margin:
    25px 0;

}


button {

  flex:
    1;

  padding:
    15px;

  border:
    none;

  border-radius:
    10px;

  font-size:
    17px;

  cursor:
    pointer;

  font-family:
    inherit;

}


.start {

  background:
    #ae8535;

  color:
    white;

}


.start:hover {

  background:
    #c69d48;

}


.stop {

  background:
    #603b35;

  color:
    white;

}


.stop:hover {

  background:
    #795048;

}


/* =========================================
   狀態
========================================= */

.status-box {

  text-align:
    center;

  padding:
    15px;

  border-radius:
    10px;

  background:
    rgba(174,133,53,.12);

  color:
    #efd278;

  line-height:
    1.8;

}


/* =========================================
   迴向文
========================================= */

.dedication {

  padding:
    20px;

  border-radius:
    12px;

  background:
    rgba(0,0,0,.25);

  line-height:
    2.2;

  font-size:
    18px;

  white-space:
    pre-line;

}


/* =========================================
   音樂
========================================= */

.music-area {

  display:
      none;
    /* flex; */

  justify-content:
    center;

  align-items:
    center;

  gap:
    10px;

  margin-top:
    20px;

}


.music-area button {

  flex:
    none;

  padding:
    9px 18px;

  font-size:
    15px;

}


/* =========================================
   Footer
========================================= */

.footer {

  margin-top:
    25px;

  text-align:
    center;

  font-size:
    13px;

  color:
    #988a72;

}


/* =========================================
   手機
========================================= */

@media(max-width:650px) {

  .container {

    padding:
      20px 14px;

  }


  h1 {

    font-size:
      24px;

    letter-spacing:
      3px;

  }


  .settings {

    grid-template-columns:
      1fr;

  }


  .buttons {

    flex-direction:
      column;

  }


  .scripture {

    font-size:
      17px;

  }

}

</style>

</head>


<body>


<div class="container">


<!-- ======================================
     標題
====================================== -->

<h1>
  南無大慈大悲觀世音菩薩
</h1>


<div class="subtitle">
  普渡誦經・功德迴向
</div>


<!-- ======================================
     姓名
====================================== -->

<label>
  往生者姓名
</label>


<input
  id="names"
  type="text"
  placeholder="多人請用逗號分隔，例如：王○○，李○○，陳○○"
>


<!-- ======================================
     設定
====================================== -->

<div class="settings">


  <div class="setting">

    <div class="setting-title">
      誦讀遍數
    </div>

    <select id="repeatCount">

      <option value="1">
        1 遍
      </option>

      <option value="3">
        3 遍
      </option>

      <option value="7">
        7 遍
      </option>

      <option value="21">
        21 遍
      </option>

      <option value="49">
        49 遍
      </option>

      <option value="108">
        108 遍
      </option>

    </select>

  </div>


  <div class="setting">

    <div class="setting-title">
      誦讀模式
    </div>

    <select id="readingMode">

      <option value="once">
        誦讀指定遍數
      </option>

      <option value="loop">
        持續循環
      </option>

    </select>

  </div>


  <div class="setting">

    <div class="setting-title">
      語速
    </div>

    <select id="speechRate">

      <option value="0.55">
        很慢
      </option>

      <option value="0.65" selected>
        慢速
      </option>

      <option value="0.75">
        標準
      </option>

      <option value="0.85">
        稍快
      </option>

    </select>

  </div>

</div>


<!-- ======================================
     經文
====================================== -->

<div class="section">

  <div class="section-title">
    《般若波羅蜜多心經》
  </div>


  <div
    id="scripture"
    class="scripture">

    正在取得經文……

  </div>

</div>


<!-- ======================================
     按鈕
====================================== -->

<div class="buttons">

  <button
    class="start"
    onclick="startReading()">

    ▶ 開始誦讀

  </button>


  <button
    class="stop"
    onclick="stopReading()">

    ■ 結束誦讀

  </button>

</div>


<!-- ======================================
     狀態
====================================== -->

<div
  id="statusBox"
  class="status-box">

  尚未開始誦讀

</div>


<!-- ======================================
     背景音樂
====================================== -->

<div class="music-area">

  <button
    onclick="toggleMusic()">

    ♪ 開／關佛樂

  </button>

</div>


<audio
  id="bgMusic"
  loop
  preload="auto">

  <!--
    把下面網址換成你的佛教純音樂 MP3
  -->

  <source
    src="YOUR_MUSIC_URL.mp3"
    type="audio/mpeg">

</audio>


<!-- ======================================
     迴向文
====================================== -->

<div class="section">

  <div class="section-title">
    迴向文
  </div>


  <div
    id="dedication"
    class="dedication">

南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩。

願以此誦唸《般若波羅蜜多心經》之功德，
專為往生者 [] 迴向。

祈願仗此佛力加被，
業障消除，
福慧增長，
離苦得樂，
蒙佛接引，
往生西方極樂世界。

  </div>

</div>


<div class="footer">

  願以誦經功德，普皆迴向。

</div>


</div>


<script>


/************************************************
 * ① GAS URL
 *
 * ★★★★★
 *
 * 把你的 GAS Web App URL 貼在這裡
 *
 ************************************************/


const GAS_URL =
  "https://script.google.com/macros/s/AKfycbx-m3hPdwjxxGj8te9zfokZmIe-UK5KZeKE9hiF0_QLlOOX3qmm-r3EqzDIRVadOowU/exec";


/************************************************
 * 全域變數
 ************************************************/


let scriptureLines = [];

let isReading = false;

let currentLine = 0;

let currentRound = 1;

let totalRounds = 1;

let voices = [];

let selectedVoice = null;


/************************************************
 * ② 載入瀏覽器語音
 ************************************************/


function loadVoices() {

  voices =
    speechSynthesis.getVoices();


  if (!voices.length) {

    return;

  }


  /*
   * 優先台灣中文
   */

  const taiwanVoice =
    voices.find(function(voice) {

      return /zh-TW/i
        .test(voice.lang);

    });


  if (taiwanVoice) {

    selectedVoice =
      taiwanVoice;

  }


  /*
   * 如果沒有台灣中文
   * 找其他中文
   */

  if (!selectedVoice) {

    selectedVoice =
      voices.find(function(voice) {

        return /zh/i
          .test(voice.lang);

      });

  }

}


speechSynthesis.onvoiceschanged =
  loadVoices;


loadVoices();


/************************************************
 * ③ 從 GAS 取得經文
 ************************************************/


async function loadContent() {

  try {

    const response =
      await fetch(
        GAS_URL +
        "?action=getContent"
      );


    if (!response.ok) {

      throw new Error(
        "GAS HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "GAS 發生錯誤"
      );

    }


    scriptureLines =
      result.data || [];


    renderScripture();


  } catch (error) {

    console.error(error);


    document
      .getElementById(
        "scripture"
      )
      .innerText =

        "取得經文失敗。\n\n" +
        "請檢查 GAS URL、部署權限及網路連線。\n\n" +
        error.message;

  }

}


/************************************************
 * ④ 顯示經文
 ************************************************/


function renderScripture() {

  const box =
    document.getElementById(
      "scripture"
    );


  box.innerHTML = "";


  if (
    !scriptureLines.length
  ) {

    box.innerText =
      "目前沒有經文內容。";

    return;

  }


  scriptureLines.forEach(
    function(text, index) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "scripture-line";


      div.id =
        "line-" + index;


      div.textContent =
        text;


      box.appendChild(div);

    }
  );

}


/************************************************
 * ⑤ 取得姓名
 ************************************************/


function getNames() {

  return document
    .getElementById(
      "names"
    )
    .value
    .trim();

}


/************************************************
 * ⑥ 建立迴向文
 ************************************************/


function buildDedication() {

  const names =
    getNames();


  return (

`南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩。

願以此誦唸《般若波羅蜜多心經》之功德，
專為往生者 ${names} 迴向。

祈願仗此佛力加被，
業障消除，
福慧增長，
離苦得樂，
蒙佛接引，
往生西方極樂世界。`

  );

}


/************************************************
 * ⑦ 前台顯示迴向文
 ************************************************/


function updateDedication() {

  const names =
    getNames();


  document
    .getElementById(
      "dedication"
    )
    .textContent =

`南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩，
南無大慈大悲觀世音菩薩。

願以此誦唸《般若波羅蜜多心經》之功德，
專為往生者 ${names || "[]"} 迴向。

祈願仗此佛力加被，
業障消除，
福慧增長，
離苦得樂，
蒙佛接引，
往生西方極樂世界。`;

}


/************************************************
 * ⑧ 開始誦讀
 ************************************************/


async function startReading() {

  /*
   * 先停止上一個朗讀
   */

  stopReading();


  const names =
    getNames();


  if (!names) {

    alert(
      "請先輸入往生者姓名。"
    );

    document
      .getElementById(
        "names"
      )
      .focus();

    return;

  }


  /*
   * 每次開始
   * 重新取得最新 Google Sheet
   */

  updateStatus(
    "正在取得最新經文……"
  );


  try {

    const response =
      await fetch(
        GAS_URL +
        "?action=getContent"
      );


    const result =
      await response.json();


    if (
      !result.success
    ) {

      throw new Error(
        result.error ||
        "取得經文失敗"
      );

    }


    scriptureLines =
      result.data || [];


    if (
      !scriptureLines.length
    ) {

      throw new Error(
        "content 工作表沒有內容"
      );

    }


    /*
     * 重新顯示
     */

    renderScripture();


    /*
     * 重新組合迴向
     */

    updateDedication();


    /*
     * 設定遍數
     */

    totalRounds =
      Number(
        document
          .getElementById(
            "repeatCount"
          )
          .value
      );


    const mode =
      document
        .getElementById(
          "readingMode"
        )
        .value;


    /*
     * 持續循環
     */

    if (
      mode === "loop"
    ) {

      totalRounds =
        Infinity;

    }


    currentLine = 0;

    currentRound = 1;

    isReading = true;


    /*
     * 鎖定姓名
     */

    document
      .getElementById(
        "names"
      )
      .disabled = true;


    /*
     * 播放佛樂
     */

    const music =
      document.getElementById(
        "bgMusic"
      );


    music.volume =
      0.18;


    music.play()
      .catch(function(error) {

        console.log(
          "背景音樂需要使用者操作",
          error
        );

      });


    /*
     * 紀錄使用者
     */

    logVisitor(
      names
    );


    /*
     * 開始
     */

    readNext();


  } catch (error) {

    console.error(error);


    stopReading();


    alert(
      "無法取得 Google Sheet 經文：\n\n" +
      error.message
    );

  }

}


/************************************************
 * ⑨ 朗讀下一段
 ************************************************/


function readNext() {

  if (!isReading) {

    return;

  }


  /*
   * 經文還沒讀完
   */

  if (
    currentLine <
    scriptureLines.length
  ) {


    highlightLine(
      currentLine
    );


    const text =
      scriptureLines[
        currentLine
      ];


    updateStatus(

      "正在誦讀第 " +
      currentRound +
      " 遍\n\n" +
      text

    );


    speak(
      text,
      function() {

        currentLine++;

        readNext();

      }
    );


    return;

  }


  /*
   * 經文完成
   * 開始迴向
   */

  clearHighlight();


  updateStatus(

    "第 " +
    currentRound +
    " 遍\n\n" +
    "正在誦讀迴向文"

  );


  speak(

    buildDedication(),

    function() {

      if (!isReading) {

        return;

      }


      /*
       * 已達指定遍數
       */

      if (
        currentRound >=
        totalRounds
      ) {

        finishReading();

        return;

      }


      /*
       * 下一遍
       */

      currentRound++;

      currentLine = 0;

      readNext();

    }

  );

}


/************************************************
 * ⑩ 語音朗讀
 ************************************************/


function speak(
  text,
  callback
) {

  if (!isReading) {

    return;

  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  /*
   * 中文
   */

  utterance.lang =
    "zh-TW";


  /*
   * 語速
   */

  utterance.rate =
    Number(
      document
        .getElementById(
          "speechRate"
        )
        .value
    );


  /*
   * 柔和
   */

  utterance.pitch =
    1.05;


  utterance.volume =
    1;


  /*
   * 使用中文語音
   */

  if (
    selectedVoice
  ) {

    utterance.voice =
      selectedVoice;

  }


  /*
   * 完成
   */

  utterance.onend =
    function() {

      if (!isReading) {

        return;

      }


      setTimeout(
        callback,
        400
      );

    };


  /*
   * 錯誤
   */

  utterance.onerror =
    function(error) {

      console.error(
        "語音錯誤：",
        error
      );


      if (isReading) {

        setTimeout(
          callback,
          500
        );

      }

    };


  speechSynthesis.speak(
    utterance
  );

}


/************************************************
 * ⑪ 高亮經文
 ************************************************/


function highlightLine(index) {

  clearHighlight();


  const line =
    document.getElementById(
      "line-" + index
    );


  if (!line) {

    return;

  }


  line.classList.add(
    "active"
  );


  line.scrollIntoView({

    behavior:
      "smooth",

    block:
      "center"

  });

}


/************************************************
 * ⑫ 清除高亮
 ************************************************/


function clearHighlight() {

  document
    .querySelectorAll(
      ".scripture-line"
    )
    .forEach(
      function(element) {

        element.classList.remove(
          "active"
        );

      }
    );

}


/************************************************
 * ⑬ 狀態
 ************************************************/


function updateStatus(text) {

  document
    .getElementById(
      "statusBox"
    )
    .innerText =
      text;

}


/************************************************
 * ⑭ 完成
 ************************************************/


function finishReading() {

  isReading = false;


  speechSynthesis.cancel();


  const music =
    document.getElementById(
      "bgMusic"
    );


  music.pause();


  document
    .getElementById(
      "names"
    )
    .disabled = false;


  clearHighlight();


  updateStatus(
    "🙏 誦讀圓滿\n\n功德迴向完成"
  );

}


/************************************************
 * ⑮ 結束
 ************************************************/


function stopReading() {

  isReading = false;


  speechSynthesis.cancel();


  const music =
    document.getElementById(
      "bgMusic"
    );


  music.pause();


  document
    .getElementById(
      "names"
    )
    .disabled = false;


  clearHighlight();


  updateStatus(
    "誦讀已結束"
  );

}


/************************************************
 * ⑯ 開關佛樂
 ************************************************/


function toggleMusic() {

  const music =
    document.getElementById(
      "bgMusic"
    );


  if (
    music.paused
  ) {

    music.volume =
      0.18;


    music.play()
      .catch(function(error) {

        console.log(
          error
        );

      });

  } else {

    music.pause();

  }

}


/************************************************
 * ⑰ 取得公開 IP
 ************************************************/


async function getPublicIP() {

  try {

    const response =
      await fetch(
        "https://api.ipify.org?format=json"
      );


    if (
      !response.ok
    ) {

      return "無法取得";

    }


    const data =
      await response.json();


    return (
      data.ip ||
      "無法取得"
    );


  } catch (error) {

    console.log(
      "IP取得失敗",
      error
    );


    return "無法取得";

  }

}


/************************************************
 * ⑱ 紀錄訪客
 ************************************************/


async function logVisitor(
  names
) {

  /*
   * 取得 IP
   */

  const ip =
    await getPublicIP();


  /*
   * 建立資料
   */

  const payload = {

    ip:
      ip,

    pageName:
      "普渡迴向誦讀",

    names:
      names,

    userAgent:
      navigator.userAgent

  };


  /*
   * POST 到 GAS
   *
   * 使用 text/plain
   * 避免觸發複雜 CORS preflight
   */

  try {

    await fetch(

      GAS_URL,

      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          ),

        mode:
          "no-cors"

      }

    );


    console.log(
      "訪客紀錄已送出"
    );


  } catch (error) {

    console.log(
      "訪客紀錄失敗",
      error
    );

  }

}

loadContent();

updateDedication();


</script>
